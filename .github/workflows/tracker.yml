name: Wohnungs-Tracker

# Zeitplan in UTC: alle 10 Minuten, deutsche Zeit ca. 6–24 Uhr (Sommer) bzw. 5–24 Uhr (Winter).
on:
  schedule:
    - cron: "*/10 4-22 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur eine Test-Nachricht schicken"
        type: boolean
        default: false

concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: write   # damit gesehen.json gespeichert werden kann

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Wohnungen prüfen
        env:
          NTFY_THEMA: ${{ secrets.NTFY_THEMA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_AN: ${{ secrets.EMAIL_AN }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python3 tracker.py --test-mail
          else
            python3 tracker.py
          fi

      - name: Gesehene Wohnungen speichern
        if: ${{ !inputs.test }}
        run: |
          git config user.name "wohnungs-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add gesehen.json
          git diff --cached --quiet || (git commit -q -m "gesehen.json aktualisiert" && git push -q)
